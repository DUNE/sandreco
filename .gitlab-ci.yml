default:
  image: baltig.infn.it:4567/dune/sand-ci/sandreco-ci

build-job:
  stage: build
  script:
    - echo "Hello, $GITLAB_USER_LOGIN!"
    - pwd
    - ls -la
    
    # Install EDEPReader from https://baltig.infn.it/dune/edep-reader
    - mkdir -p ../edep-reader
    - pushd ../edep-reader
    - git clone --depth 1 https://baltig.infn.it/dune/edep-reader source
    - mkdir build
    - cd build
    - cmake -DCMAKE_INSTALL_PREFIX=../install ../source
    - make -j8 install
    - source ../install/setup.sh
    - popd
    
    - mkdir build
    - mkdir install
    - cd build
    - cmake -DCMAKE_INSTALL_PREFIX=../install ../
    - make
    - make -j8 install
    - ls ../install

  artifacts:
    paths:
    - install/*.*
    - install/*


